<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111716"><title>OPEN / WEEKLY — AI 开源周榜</title><style> *{box-sizing:border-box}body{margin:0;background:#111716;color:#f4f5ed;font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:inherit}input{background:none;border:0;outline:0;width:100%}button.chip,button.sort{background:none}button.chip.active{background:#e6f264}button.sort{border:0}button.nav{background:none;border:0} .stats>div{flex:1;display:flex;flex-direction:column;gap:8px;padding-left:22px;border-left:1px solid #333b31}.stats>div:first-child{padding:0;border:0}.search>span{font-size:24px;color:#c0c7bd}.nav>span:first-child{font-size:24px}.period span{margin:0 14px;color:#a2aba3}.period{background:none;border:0;padding:0;cursor:pointer}.hero-mark{pointer-events:none}.toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#e6f264;color:#222a18;border-radius:8px;z-index:30;font-size:13px}.project{width:100%;background:none;border-top:0;border-left:0;border-right:0;text-align:left;color:inherit;font-family:inherit}.growth>span{display:block}.nav:focus-visible,.project:focus-visible,button:focus-visible{outline:2px solid #e6f264;outline-offset:4px} .page{max-width:1120px;margin:auto;padding:0 32px 110px}.top{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2b322e}.brand{font-size:16px;font-weight:800;letter-spacing:2px}.edition,.muted{font-size:12px;color:#8c9690}.hero{position:relative;padding:42px 0 30px;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:2.5px;color:#c3caad}.headline{font-size:64px;font-weight:850;line-height:1.13;letter-spacing:-3px;margin-top:20px}.yellow{color:#e6f264}.subtitle{font-size:14px;color:#a2aba3;margin-top:20px}.period{font-size:12px;margin-top:26px;color:#e6f264}.period text{margin:0 14px;color:#a2aba3}.hero-mark{position:absolute;right:16px;top:22px;font-size:230px;color:#e6f264;opacity:.13;line-height:1}.stats{display:flex;border-top:1px solid #333b31;border-bottom:1px solid #333b31;padding:22px 0;margin-bottom:26px}.stats>view{flex:1;display:flex;flex-direction:column;gap:8px;padding-left:22px;border-left:1px solid #333b31}.stats>view:first-child{padding:0;border:0}.stat{font-size:27px;letter-spacing:-1px;font-weight:650}.search{display:flex;gap:13px;align-items:center;background:#1c2320;border:1px solid #303a32;border-radius:10px;padding:13px 17px}.search>text{font-size:24px;color:#c0c7bd}.search input{flex:1;font-size:14px;color:#f4f5ed}.placeholder{color:#778178}.filters{margin:20px 0 30px;white-space:nowrap}.filter-inner{display:flex;gap:9px}.chip{padding:9px 19px;font-size:13px;color:#adb4aa;border:1px solid #353d33;border-radius:6px;cursor:pointer}.chip.active{background:#e6f264;color:#202617;border-color:#e6f264;font-weight:700}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title{font-size:23px;font-weight:750}.count{font-size:12px;color:#788475}.sort{font-size:12px;color:#b2bba9;cursor:pointer}.project{display:flex;align-items:center;gap:18px;padding:23px 0;border-bottom:1px solid #2c342e;cursor:pointer}.rank{font-size:23px;color:#64705f;font-weight:700;width:34px;flex-shrink:0;font-variant-numeric:tabular-nums}.rank.first{color:#e6f264}.project-body{flex:1;min-width:0}.project-name{font-size:19px;font-weight:730;letter-spacing:-.4px;overflow-wrap:anywhere}.desc{font-size:12px;color:#a1aa9e;line-height:1.6;margin-top:7px}.meta{display:flex;align-items:center;gap:14px;margin-top:10px}.tag{font-size:10px;border:1px solid #65735d;padding:3px 7px;border-radius:4px}.stars{font-size:11px;color:#8e9b85}.growth{text-align:right;color:#e6f264;font-size:23px;font-weight:750;display:flex;flex-direction:column;gap:7px;min-width:96px;font-variant-numeric:tabular-nums}.growth-caption{font-size:10px;color:#7f8a78;font-weight:400}.footnote{font-size:10px;letter-spacing:.6px;color:#778170;text-align:center;margin:30px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#171e19f5;border-top:1px solid #364030;display:flex;justify-content:center;gap:90px;padding:18px 15px calc(18px + env(safe-area-inset-bottom));z-index:5}.nav{font-size:12px;color:#8b9684;display:flex;align-items:center;gap:9px;cursor:pointer}.nav>text:first-child{font-size:24px}.nav.selected{color:#e6f264}.badge{font-size:11px;padding:2px 6px;border-radius:5px;background:#303a29}.empty{padding:55px 0;color:#a1aa9e;text-align:center;font-size:14px}.overlay{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:560px;box-sizing:border-box;padding:30px 25px calc(30px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#20291f;border:1px solid #45513a}.sheet-top{display:flex;justify-content:space-between;align-items:center}.close{padding:8px;cursor:pointer;color:#b2bba9}.sheet-title{font-size:30px;font-weight:750;margin-top:24px;overflow-wrap:anywhere}.sheet-desc{font-size:15px;line-height:1.8;color:#b4bfad;margin:18px 0}.detail-stats{color:#e6f264;font-size:14px}.notice{font-size:12px;color:#8f9d87;line-height:1.8;margin:22px 0}.primary,.secondary{display:block;width:100%;padding:15px;background:#e6f264;color:#222a18;border:0;border-radius:8px;font-size:14px;font-weight:700;margin-top:12px;cursor:pointer;line-height:1.5}.secondary{background:#303b29;color:#d4dfca}@media(min-width:760px){.page{padding-left:90px;padding-right:90px}.hero{padding-top:55px}.headline{font-size:85px}.hero-mark{font-size:280px;right:10px}.project{padding:25px 8px}.project:hover{background:#1a231b}.desc{font-size:14px}.project-name{font-size:21px}.growth{font-size:28px}.stats{max-width:500px}.sheet{align-self:center;border-radius:20px}.bottom{gap:160px}}@media(max-width:390px){.page{padding-left:20px;padding-right:20px}.headline{font-size:57px}.growth{font-size:19px;min-width:80px}.project{gap:10px}.rank{width:28px}.project-name{font-size:17px}.edition{font-size:10px}}

/* Purpose labels stay in a dedicated right-hand column, as in the reference. */
.purpose-tag{display:inline-block;flex-shrink:0;white-space:nowrap;background:#c3d0d7;color:#18212b;border:0;border-radius:5px;padding:5px 8px;font-size:12px;font-weight:750;line-height:1.3;text-align:center;letter-spacing:0}
.project{display:grid;grid-template-columns:34px minmax(0,1fr) 80px 110px;column-gap:18px}
.project>.purpose-tag{justify-self:start}.desc{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.filters{overflow-x:auto}.chip{flex-shrink:0}
@media(max-width:600px){.page{padding-left:16px;padding-right:16px}.project{grid-template-columns:24px minmax(0,1fr) 64px 76px;column-gap:8px;padding:20px 0}.rank{width:24px;font-size:20px}.project-name{font-size:15px;line-height:1.4}.growth{min-width:0;font-size:18px}.purpose-tag{font-size:11px;padding:4px 6px}.desc{font-size:11px}.meta{gap:0}.stars{font-size:10px}}
 .sheet{max-height:90vh;overflow-y:auto}.source-link{display:block;color:#a8d8ff;font-size:13px;overflow-wrap:anywhere;text-decoration:none;margin:14px 0} .detail-trigger{background:none;border:0;color:#aab79f;font-size:10px;padding:3px 0;cursor:pointer}.meta{flex-wrap:wrap;gap:6px 14px}.project-name:hover{text-decoration:underline!important}.project-name:focus-visible,.detail-trigger:focus-visible{outline:2px solid #e6f264;outline-offset:4px}</style></head><body><main class="page"><header class="top"><span class="brand">◈ OPEN / WEEKLY</span><span class="edition">开源灵感，每周更新</span></header><section class="hero"><div class="eyebrow">GITHUB TRENDING · WEEKLY</div><h1 class="headline" style="margin-bottom:0">让好项目<div>被<span class="yellow">看见。</span></div></h1><div class="subtitle">每周发现，下一件改变效率的 AI 工具。</div><button class="period" id="refreshData">刷新官方周榜 ↻</button><div id="updatedAt" class="subtitle" style="font-size:11px"></div><div class="hero-mark">↗</div></section><section class="stats"><div><span class="stat" id="projectTotal"></span><span class="muted">精选项目</span></div><div><span class="stat" id="growthTotal"></span><span class="muted">本周新增 Star · 约</span></div><div><span class="stat" id="categoryTotal"></span><span class="muted">覆盖领域</span></div></section><label class="search"><span>⌕</span><input id="query" placeholder="搜索项目、用途或分类" aria-label="搜索项目"></label><div class="filters"><div class="filter-inner" id="filters"></div></div><div class="section-head"><div><span class="section-title" id="sectionTitle">开源周榜</span><span class="count" id="count"></span></div><button class="sort" id="sort">按周增星 ↓</button></div><section class="list" id="list"></section><div class="footnote"><a href="https://github.com/trending?since=weekly" target="_blank" rel="noopener" style="color:inherit">来源：GitHub Trending 周榜</a><br>筛选 AI 相关项目后按周增星排序，非全站排名。<br>自动更新需要本地服务运行；离线打开显示最近一次成功快照。</div><nav class="bottom"><button class="nav selected" id="discover"><span>▥</span>发现榜单</button><button class="nav" id="favorites"><span>☆</span>我的收藏 <span class="badge" id="savedCount">0</span></button></nav></main><div id="modal"></div><div role="status" id="toast"></div><script src="live-data.js"></script><script>let projects=window.WEEKLY.projects;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let saved=[];try{saved=JSON.parse(localStorage.getItem('ai-weekly-saved')||'[]');if(!Array.isArray(saved))saved=[]}catch{}let category='全部',tab='榜单',sort='growth',lastFocus=null;const $=id=>document.getElementById(id);let toastTimer;
function toast(message){$('toast').className='toast';$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').className='';$('toast').textContent=''},2200)}
function render(){const q=$('query').value.trim().toLowerCase();let list=projects.filter(p=>(category==='全部'||p.category===category)&&(!q||(p.name+' '+(p.summary||'')+' '+p.desc+' '+p.category).toLowerCase().includes(q))&&(tab!=='收藏'||saved.includes(p.id)));if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));$('filters').innerHTML=['全部',...new Set(projects.map(p=>p.category))].map(c=>`<button class="chip ${category===c?'active':''}" aria-pressed="${category===c}" data-category="${c}">${c}</button>`).join('');$('list').innerHTML=list.map(p=>`<div class="project" data-id="${p.id}"><span class="rank ${p.rank<4?'first':''}">${String(p.rank).padStart(2,'0')}</span><span class="project-body"><a class="project-name" style="display:block;color:inherit;text-decoration:none" href="${p.url}" target="_blank" rel="noopener">${p.name} ↗</a><span class="desc" style="display:block">${esc(p.summary || p.desc)}</span><span class="meta"><span class="stars">☆ ${p.stars} ${saved.includes(p.id)?'· 已收藏':''}</span><button class="detail-trigger" aria-label="查看 ${p.name} 详情">详情 / 收藏</button></span></span><span class="tag purpose-tag" style="background:${p.color}">${p.category}</span><span class="growth"><span>+${p.growth.toLocaleString('en-US')}</span><span class="growth-caption">本周新增</span></span></div>`).join('')||`<div class="empty">${tab==='收藏'?'还没有收藏，点开喜欢的项目试试。':'没有找到项目，换个关键词试试。'}</div>`;$('sectionTitle').textContent=tab==='收藏'?'我的收藏':'开源周榜';$('count').textContent=` / ${list.length} 项目`;$('savedCount').textContent=saved.length;$('discover').classList.toggle('selected',tab==='榜单');$('favorites').classList.toggle('selected',tab==='收藏');$('sort').textContent=sort==='growth'?'按周增星 ↓':'按名称 ↓'}
function close(){ $('modal').innerHTML='';document.body.style.overflow='';if(lastFocus)lastFocus.focus() }
function detail(id){const p=projects.find(p=>p.id===id);lastFocus=document.activeElement;$('modal').innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${p.name} 项目详情"><div class="sheet-top"><span class="tag purpose-tag" style="background:${p.color}">${p.category}</span><button class="close" style="background:none;border:0" aria-label="关闭">✕</button></div><div class="sheet-title">${p.name}</div><div class="sheet-desc">${esc(p.summary || p.desc)}</div><a class="source-link" href="${p.url}" target="_blank" rel="noopener">源码：${esc(p.name)} ↗</a><div class="detail-stats">+${p.growth.toLocaleString('en-US')} 本周新增 · ☆ ${p.stars} 总星标</div><div class="notice">${window.WEEKLY.scope}<br>更新：${window.WEEKLY.updatedAt}</div><button class="primary" id="save">${saved.includes(id)?'★ 已收藏 · 取消收藏':'☆ 收藏这个项目'}</button><a class="secondary" href="${p.url}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">查看开源源码（GitHub）↗</a><button class="secondary" id="copy">复制仓库链接</button></section></div>`;document.body.style.overflow='hidden';$('modal').querySelector('.close').onclick=close;$('modal').querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))close()};$('save').onclick=()=>{saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem('ai-weekly-saved',JSON.stringify(saved))}catch{toast('浏览器限制存储，收藏仅本次有效')}render();$('save').textContent=saved.includes(id)?'★ 已收藏 · 取消收藏':'☆ 收藏这个项目'};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(p.url);toast('仓库链接已复制')}catch{toast('请手动复制：'+p.url)}};$('modal').querySelector('.close').focus()}
$('filters').onclick=e=>{if(e.target.dataset.category){category=e.target.dataset.category;render()}};$('list').onclick=e=>{if(e.target.closest('a'))return;const b=e.target.closest('[data-id]');if(b)detail(b.dataset.id)};$('query').oninput=render;$('sort').onclick=()=>{sort=sort==='growth'?'name':'growth';render()};$('discover').onclick=()=>{tab='榜单';render()};$('favorites').onclick=()=>{tab='收藏';render()};document.onkeydown=e=>{if(!$('modal').firstChild)return;if(e.key==='Escape')close();if(e.key==='Tab'){const bs=[...$('modal').querySelectorAll('button,a[href]')];const first=bs[0],last=bs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};
function metadata(){const d=window.WEEKLY;$('updatedAt').textContent='最近成功更新：'+d.updatedAt.replace('T',' ').replace('+08:00','（北京时间）');$('projectTotal').textContent=projects.length;$('growthTotal').textContent=(projects.reduce((n,p)=>n+p.growth,0)/1000).toFixed(1)+'k ↑';$('categoryTotal').textContent=new Set(projects.map(p=>p.category)).size}
let loading=false;
async function loadWeekly(force=false){if(loading)return;if(location.protocol==='file:'){if(force)toast('请通过本地服务打开以刷新，详见使用说明');return}loading=true;$('refreshData').disabled=true;$('refreshData').textContent='正在读取官方周榜…';try{const r=await fetch('/api/weekly'+(force?'?refresh=1':''),{cache:'no-store'});const d=await r.json();if(!r.ok||!Array.isArray(d.projects)||!d.projects.length)throw Error(d.error||'数据无效');window.WEEKLY=d;projects=d.projects;metadata();render();if(force)toast('官方周榜已更新')}catch(e){toast('刷新失败，保留上次成功数据');$('updatedAt').textContent+=' · 刷新失败'}finally{loading=false;$('refreshData').disabled=false;$('refreshData').textContent='刷新官方周榜 ↻'}}
$('refreshData').onclick=()=>loadWeekly(true);metadata();render();loadWeekly();setInterval(()=>loadWeekly(),3600000);</script></body></html>
